; Dois firmwares no mesmo projeto.
;   pio run -e deauth --target upload       -> grava a ESP #1 (deauth)
;   pio run -e evil_twin --target upload     -> grava a ESP #2 (evil twin + sniffer ativo)
;
; Observacao: com framework = arduino, espidf o build e dirigido pelo
; src/CMakeLists.txt (GLOB de src/), entao todos os .cpp sao compilados e o
; firmware ativo e escolhido pela flag -D FW_* (ver src/main.cpp).

[env]
platform = espressif32
board = esp32dev
framework = arduino, espidf
monitor_speed = 9600
build_flags =
    -Wl,--allow-multiple-definition

[env:deauth]
build_flags =
    ${env.build_flags}
    -D FW_DEAUTH

[env:evil_twin]
build_flags =
    ${env.build_flags}
    -D FW_EVIL_TWIN
